[project]
name = "stt-benchmark"
version = "0.1.0"
description = "Benchmark: Cohere Transcribe vs Gemma 4 for speech-to-text"
readme = "README.md"
authors = [
    { name = "Joe Helbing", email = "joehelbing@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "datasets>=4.8.4",
    "jiwer>=4.0.0",
    "kaleido>=1.2.0",
    "librosa>=0.11.0",
    "nvidia-ml-py3>=7.352.0",
    "openai>=2.30.0",
    "pandas>=3.0.2",
    "plotly>=6.6.0",
    "protobuf>=7.34.1",
    "sentencepiece>=0.2.1",
    "soundfile>=0.13.1",
    "torch>=2.11.0",
    "transformers>=5.5.0",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
